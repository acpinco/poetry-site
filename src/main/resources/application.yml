spring:
  application:
    name: think-or-drink-poetry
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:poetry_site}
    username: ${POSTGRES_USER:poetry_app}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLED:false}
          # JavaMail waits forever by default; a hung SMTP server would pin a mail thread.
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

server:
  port: ${SERVER_PORT:8080}
  # Trust the HTTPS scheme supplied by Caddy and Cloudflare Tunnel when
  # building redirects and OpenAPI URLs.
  forward-headers-strategy: framework

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

app:
  # Cloudflare sets this to the real visitor IP; the app is only reachable through Cloudflare and Caddy.
  client-ip-header: ${CLIENT_IP_HEADER:CF-Connecting-IP}
  mail:
    from: ${MAIL_FROM:Think or Drink Poetry <noreply@localhost>}
  contact:
    # Required: where Contact page messages are delivered.
    to: ${CONTACT_EMAIL}
  auth:
    magic-link-base-url: ${MAGIC_LINK_BASE_URL:http://localhost:8080}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
    magic-link-ttl: PT15M
    # Sign-in email limits: per address per 15 minutes, per client IP per hour, and site-wide per hour.
    magic-link-request-limit: 5
    magic-link-ip-limit: 10
    magic-link-global-limit: 200
    # Cloudflare Turnstile protects new-account sign-up. Without a secret key, sign-up is disabled.
    turnstile-site-key: ${TURNSTILE_SITE_KEY:}
    turnstile-secret-key: ${TURNSTILE_SECRET_KEY:}
    session-ttl: P7D
    session-cookie-name: poetry_session
    secure-session-cookie: ${SECURE_SESSION_COOKIE:false}
    admin-email: ${ADMIN_EMAIL:}
    # Required: the address locked-out poets are told to contact.
    admin-contact-email: ${ADMIN_CONTACT_EMAIL}
